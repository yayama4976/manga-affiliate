name: daily
on:
  workflow_dispatch:
    inputs:
      test:
        description: "テスト実行(楽天IDなし・1本だけ生成)"
        type: boolean
        default: true
  # 楽天キーを登録して本番で確認できたら、下の2行の先頭の # を消すと毎朝7時(JST)に自動実行されます
  # schedule:
  #   - cron: "0 22 * * *"
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python rakuten_free_bot.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TEST_MODE: ${{ inputs.test && '1' || '' }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          git rm -r -q -f __pycache__ 2>/dev/null || true
          git add docs posted.json
          git commit -m "daily update" || true
          git pull --rebase --autostash origin main
          git push || (git pull --rebase --autostash origin main && git push)
